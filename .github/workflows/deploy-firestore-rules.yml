name: Deploy Firestore privacy rules

on:
  push:
    branches:
      - codex/free-render-preview
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Explain skipped deployment when credentials are not configured
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "Firestore rules were not deployed because FIREBASE_SERVICE_ACCOUNT_JSON is not configured."

      - name: Authenticate to Google Cloud
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Node.js
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy only the named Firestore database rules
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          npm install --global firebase-tools
          firebase deploy --only firestore:rules --project tidy-filament-zxq1s --non-interactive
