name: Verify web app

on:
  push:
    branches:
      - codex/comprehensive-overhaul
  pull_request:
    branches:
      - main
      - codex/free-render-preview

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Report production asset sizes
        run: |
          du -sh dist
          du -h dist/assets/* | sort -hr | head -20
      - name: Server API and legacy-data smoke test
        run: node scripts/smoke-server.mjs
        env:
          ADMIN_BOOTSTRAP_PASSWORD: Smoke-Only-Not-A-Real-Credential-123!
