name: Verify web app

on:
  push:
    branches:
      - codex/comprehensive-overhaul
  pull_request:
    branches:
      - main
      - codex/free-render-preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
