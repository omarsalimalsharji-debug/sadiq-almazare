name: Build Android APK

on:
  push:
    branches:
      - codex/global-seasonal-diagnosis-privacy-2026-11-19
      - codex/global-diagnosis-seasonal-admin-2026-11-19
      - codex/premium-mobile-apk-updater-livebase-2026-11-19
      - codex/free-render-preview
      - codex/fix-educational-videos-and-release-signing-2026-11-19
      - main
      - codex/fix-apk-manifest-release-version-2026-11-20
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const parts = pkg.version.split('.');
          if (parts.length !== 3 || parts.some((part) => !/^[0-9]+$/.test(part))) {
            throw new Error('package.json must use MAJOR.MINOR.PATCH');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, 'APP_VERSION=' + pkg.version + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + pkg.version + '\n');
          NODE

      - name: Verify release manifest version and URL
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('public/app-update.json', 'utf8'));
          if (pkg.version !== manifest.version) throw new Error('package.json and app-update.json versions do not match');
          if (manifest.available && !String(manifest.apkUrl || '').includes('/releases/download/android-v' + pkg.version + '/')) {
            throw new Error('Active update URL must point to this app version release');
          }
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Select JSON Capacitor config for Android CI
        run: rm capacitor.config.ts

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android launcher icons from the approved app mark
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          for size in 48 72 96 144 192; do
            case "$size" in
              48) density=mdpi ;;
              72) density=hdpi ;;
              96) density=xhdpi ;;
              144) density=xxhdpi ;;
              192) density=xxxhdpi ;;
            esac
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            convert public/icon.svg -background none -resize "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            convert public/icon.svg -background none -resize "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
            convert public/icon.svg -background none -resize "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png"
          done

      - name: Decode stable release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/sadiq-release.jks

      - name: Configure Android version and signing
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/android/app/sadiq-release.jks', github.workspace) || '' }}
        run: python scripts/configure-android-release.py

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/sadiq-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Build debug APK when release signing is not configured
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == '' }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk sadiq-almazare.apk
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk sadiq-almazare.apk
            echo "SIGNED_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadiq-almazare-android-v${{ env.APP_VERSION }}
          path: sadiq-almazare.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK release
        if: ${{ env.SIGNED_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.APP_VERSION }}
          name: صديق المزارع - الإصدار ${{ env.APP_VERSION }}
          body: |
            تحديث صديق المزارع ${{ env.APP_VERSION }}: تحسينات واستقرار وتجربة استخدام أفضل للمزارعين.
            يتطلب تثبيت التحديث موافقة المستخدم من Android.
          files: sadiq-almazare.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable in-app update notice after signed release
        if: ${{ env.SIGNED_RELEASE == 'true' }}
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const path = 'public/app-update.json';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            const content = {
              available: true,
              version: process.env.APP_VERSION,
              apkUrl: 'https://github.com/' + owner + '/' + repo + '/releases/download/android-v' + process.env.APP_VERSION + '/sadiq-almazare.apk',
              mandatory: false,
              releaseNotes: [
                'تحسين سرعة التشخيص واستقرار الخدمة',
                'تحسين تجربة الاستخدام على الهاتف',
                'إصلاح اكتشاف تحديثات التطبيق'
              ]
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              sha: current.data.sha,
              message: 'Enable in-app APK update notification [skip ci]',
              content: Buffer.from(JSON.stringify(content, null, 2) + '\n').toString('base64')
            });
