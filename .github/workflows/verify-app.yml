name: Verify application

on:
  push:
    branches:
      - codex/global-seasonal-diagnosis-privacy-2026-11-19
      - codex/free-render-preview
      - codex/development-from-main-2026-11-18
      - codex/diagnosis-safety-hardening-2026-11-18
      - codex/admin-bootstrap-rotation-pr-2026-11-20
  pull_request:
    branches:
      - main
      - codex/free-render-preview
      - codex/development-from-main-2026-11-18

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
